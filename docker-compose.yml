services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
      DATABASE_URL: sqlite:////data/app.db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
    volumes:
      - app-data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  app-data:
